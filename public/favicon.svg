<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Obsidian / Deep Space -->
    <linearGradient id="lwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Borda sutil com brilho azul elétrico -->
    <linearGradient id="lwBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Faceta Superior (Iluminação Cyan / Sky Blue) -->
    <linearGradient id="lwTopFace" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Faceta Esquerda (Royal Blue vibrante - L-Facet) -->
    <linearGradient id="lwLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Faceta Direita (Deep Sapphire / Navy Shadow - W-Facet) -->
    <linearGradient id="lwRightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0B1224" />
    </linearGradient>

    <!-- Gradiente do Monograma Central / Núcleo Pro -->
    <linearGradient id="lwCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Brilho Ambiente Glow -->
    <radialGradient id="lwAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Brilho de Fundo -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#lwAmbientGlow)" />

  <!-- Container Squircle Principal -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#lwBg)" stroke="url(#lwBorder)" stroke-width="14" />

  <!-- Marca Central: Cubo Isométrico Arquitetural LocalWeb Pro -->
  <!-- Faceta Superior (Top) -->
  <polygon points="256,120 376,189 256,258 136,189" fill="url(#lwTopFace)" />

  <!-- Faceta Esquerda (Left) -->
  <polygon points="136,189 256,258 256,396 136,327" fill="url(#lwLeftFace)" />

  <!-- Faceta Direita (Right) -->
  <polygon points="256,258 376,189 376,327 256,396" fill="url(#lwRightFace)" />

  <!-- Linhas Internas Geométricas de Precisão (Web Grid & Estrutura) -->
  <line x1="256" y1="120" x2="256" y2="258" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.45" stroke-linecap="round" />
  <line x1="136" y1="189" x2="256" y2="258" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.3" stroke-linecap="round" />
  <line x1="376" y1="189" x2="256" y2="258" stroke="#000000" stroke-width="5" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Acento 'P' / 'Pro' Apex no Topo -->
  <circle cx="256" cy="189" r="16" fill="url(#lwCore)" />
  <circle cx="256" cy="189" r="28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6" />

  <!-- Linha dinâmica de fluxo no canto inferior -->
  <path d="M 176 348 L 256 394 L 336 348" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7" />
</svg>
