<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Leads & Orçamentos | LocalWeb Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--midnight-border);
    }
    .admin-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #FFFFFF;
    }
    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 230, 153, 0.12);
      border: 1px solid rgba(0, 230, 153, 0.3);
      color: #00E699;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00E699;
      box-shadow: 0 0 8px #00E699;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: #0D121F;
      border: 1px solid var(--midnight-border);
      border-radius: var(--radius-md);
      padding: 20px;
    }
    .stat-val {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #60A5FA;
      margin-bottom: 4px;
    }
    .stat-lbl {
      font-size: 0.85rem;
      color: #94A3B8;
    }
    .leads-table-wrapper {
      background: #0D121F;
      border: 1px solid var(--midnight-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background: #090E1A;
      color: #94A3B8;
      font-weight: 600;
      padding: 16px 20px;
      border-bottom: 1px solid var(--midnight-border);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #E2E8F0;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-novo { background: rgba(59, 130, 246, 0.18); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #25D366;
      color: #05070B;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
    }
    .whatsapp-btn:hover {
      background: #22bf5b;
    }
    .refresh-btn {
      background: #1E293B;
      color: #FFFFFF;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover {
      background: #334155;
    }
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
          <a href="/" style="color: #94A3B8; text-decoration: none; font-size: 0.85rem;">← Voltar para o Site</a>
          <span class="db-badge">
            <span class="pulse-dot"></span>
            Neon PostgreSQL Conectado
          </span>
        </div>
        <h1 class="admin-title">Painel de Leads & Orçamentos</h1>
      </div>
      <button class="refresh-btn" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Atualizar Dados
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-lbl">Total de Leads Captados</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-hoje" style="color: #00E699;">0</div>
        <div class="stat-lbl">Registrados Hoje</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-database" style="font-size: 1.3rem; color: #A78BFA; line-height: 2rem;">Neon Cloud</div>
        <div class="stat-lbl">PostgreSQL 18 (AWS sa-east-1)</div>
      </div>
    </div>

    <div class="leads-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Empresa</th>
            <th>Nicho</th>
            <th>WhatsApp</th>
            <th>Objetivo do Site</th>
            <th>Status</th>
            <th>Data de Envio</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="leads-table-body">
          <tr>
            <td colspan="8" class="empty-state">Carregando leads do Neon PostgreSQL...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadLeads() {
      const tbody = document.getElementById('leads-table-body');
      const statTotal = document.getElementById('stat-total');
      const statHoje = document.getElementById('stat-hoje');

      try {
        const res = await fetch('/api/leads');
        const json = await res.json();

        if (!json.success || !json.data) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Nenhum lead encontrado ou erro na resposta da API.</td></tr>`;
          return;
        }

        const leads = json.data;
        statTotal.textContent = leads.length;

        const todayStr = new Date().toISOString().slice(0, 10);
        const todayCount = leads.filter(l => (l.created_at || '').slice(0, 10) === todayStr).length;
        statHoje.textContent = todayCount;

        if (leads.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="empty-state">
                Nenhum lead registrado ainda.<br>
                Preencha o formulário de diagnóstico na página inicial para testar!
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = leads.map(l => {
          const date = new Date(l.created_at).toLocaleString('pt-BR');
          const cleanPhone = (l.phone || '').replace(/\D/g, '');
          const waUrl = `https://wa.me/55${cleanPhone}?text=Ol%C3%A1%20${encodeURIComponent(l.company_name)}!%20Recebemos%20sua%20solicita%C3%A7%C3%A3o%20de%20or%C3%A7amento%20na%20LocalWeb%20Pro.`;

          return `
            <tr>
              <td style="color: #64748B; font-weight: 600;">#${l.id}</td>
              <td style="font-weight: 700; color: #FFFFFF;">${escapeHtml(l.company_name)}</td>
              <td><span style="color: #94A3B8;">${escapeHtml(l.niche || 'Geral')}</span></td>
              <td style="font-family: monospace;">${escapeHtml(l.phone)}</td>
              <td style="max-width: 250px; color: #CBD5E1;">${escapeHtml(l.goal || 'Site institucional')}</td>
              <td><span class="badge-status badge-novo">${escapeHtml(l.status || 'novo')}</span></td>
              <td style="font-size: 0.8rem; color: #64748B;">${date}</td>
              <td>
                <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
                  <span>Conversar</span>
                </a>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state" style="color: #EF4444;">Erro ao conectar com a API: ${err.message}</td></tr>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.getElementById('btn-refresh').addEventListener('click', loadLeads);
    loadLeads();
  </script>
</body>
</html>
